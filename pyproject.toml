[project]
name = "vigilai"
version = "2.0.0"
description = "Compliance-centered evaluation framework for Generative AI models."
authors = [
    {name = "Diana Chang"},
    {name = "Ian Duhamel Hayes"},
]
# Forked from COMPL-AI (LatticeFlow AI / ETH Zurich / INSAIT); see NOTICE.
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "inspect-evals[swe_bench]",
    "inspect-ai",
    "openai>=2.26.0",
    "typer>=0.19.0",
    "bidict>=0.23.1",
    "detoxify>=0.5.2",
    "gdown>=5.2.0",
    "gensim>=4.3.3",
    "llm-rules",
    "nltk>=3.9.1",
    "numpy>=1.26.4",
    "platformdirs>=4.3.8",
    "polars>=1.32.2",
    "scipy>=1.13.1",
    "torch>=2.7.1",
    "fairlearn>=0.12.0",
    "datasets>=3.6.0",
    "regex>=2025.7.34",
    "spacy>=3.8.7",
    "en-core-web-sm",
    "emoji>=2.15.0",    
    "syllapy>=0.7.2",
    "strong-reject",
    "tqdm>=4.67.1",
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "livebench",
]

[dependency-groups]
# `mypy` is here because `[tool.mypy]` below has been configured since Phase 1 while the tool was
# never a dependency, so every phase type-checked with `uv run --with mypy mypy …` — a resolve of
# whatever mypy was newest that day, and therefore a check that could change verdict without any
# change to this repo. Pinned to the group, it is locked in `uv.lock` like everything else and
# `uv run mypy src/vigilai/` is reproducible.
dev = ["pytest>=8.0.0", "pytest-cov>=4.1.0", "types-PyYAML", "mypy>=1.11"]

[project.entry-points.inspect_ai]
vigilai = "vigilai._registry"

[project.scripts]
vigilai = "vigilai._cli:main"

[project.urls]
Homepage = "https://compl-ai.org/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilai"]

[tool.hatch.metadata]
allow-direct-references = true


[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = [
    "^src/vigilai/tasks/self_check_consistency/compact_ie/", 
    "^src/vigilai/tasks/ifbench/instructions.*",  
    "^src/vigilai/tasks/ifbench/evaluation_lib\\.py$",
]

[tool.typos]
default.check-file = true
default.check-filename = true
default.extend-ignore-identifiers-re = []
default.extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
    # `typos` splits on the hyphen and reads the English prefix `mis-` as a misspelling of
    # `miss`/`mist`. "Mis-keyed" (an item whose answer key points at the wrong person) is the
    # LLM-judge review's own term of art, used in `docs/bbq-brazil-llm-judge-review.md` and in the
    # `bbq_brazil` scenario comments that cite it. Scoped to this one literal rather than adding
    # `mis` to the dictionary, which would hide the real typo repo-wide.
    "(?i)\\bmis-keyed\\b",
]
files.extend-exclude = [
    "*.ipynb",  # Notebook cells are asigned a hash.
    "src/vigilai/tasks/self_check_consistency/topics.py",
    "src/vigilai/tasks/self_check_consistency/compact_ie/",
    "src/vigilai/tasks/mmlu_pro_robustness/correct_to_misspelling.json",
]

# Portuguese words that `typos` reads as English misspellings.
#
# vigilAI's Brazil benchmarks are written in pt-BR: the `bbq_brazil` scenarios, the
# `explanation_quality` / `contestation_review` prompts, and the deterministic scorers'
# Portuguese detection cues. Iteration 2 grew `bbq_brazil` from 22 to 100 scenarios, which
# multiplied these false positives (e.g. `classe`, from the ABEP classe A-E class markers).
#
# Each word below is mapped **to itself**, which is `typos`' documented way of saying "this
# spelling is correct". That is deliberately narrower than the alternatives:
#   * excluding the Brazil task files would stop checking thousands of lines of English
#     docstrings and comments that live in the same modules;
#   * an `extend-ignore-identifiers-re` pattern broad enough to cover pt-BR prose would also
#     hide real English typos;
#   * disabling `typos` for the repo is not on the table.
# A genuine English typo anywhere in the repo is still reported.
#
# Note on `analise`: the correct pt-BR spelling is "análise". The unaccented form is
# intentional in the scorers, whose `_normalize` folds accents before matching, so the cue
# lists store accent-folded strings.
#
# NOT silenced, and therefore still failing `uvx typos`: `explicitely` / `explicite` /
# `explcitely` / `fo` in `src/vigilai/tasks/cab/*.json`. Those are real English typos in data
# vendored from upstream COMPL-AI; they should be fixed in place (or the upstream files excluded
# as vendored data) when Phase 10 makes `uvx typos` clean, not hidden behind a dictionary entry.
[tool.typos.default.extend-words]
analise = "analise"
candidata = "candidata"
classe = "classe"
cliente = "cliente"
clientes = "clientes"
comercial = "comercial"
curso = "curso"
dependente = "dependente"
disciplinas = "disciplinas"
excede = "excede"
formar = "formar"
fundamentais = "fundamentais"
instituto = "instituto"
itens = "itens"
jornal = "jornal"
limite = "limite"
momento = "momento"
potencial = "potencial"
presentes = "presentes"
programa = "programa"
registre = "registre"
responde = "responde"
ser = "ser"
suspenso = "suspenso"
tema = "tema"
vai = "vai"
# Not Portuguese, but correct as written in the committed research notes:
# FPR = False Positive Rate; BA = the IBGE code for the state of Bahia.
BA = "BA"
FPR = "FPR"

[tool.uv.sources]
inspect-evals = { git = "https://github.com/UKGovernmentBEIS/inspect_evals" }
llm-rules = { git = "https://github.com/normster/llm_rules" }
strong_reject = { git = "https://github.com/dsbowen/strong_reject" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
livebench = { git = "https://github.com/LiveBench/LiveBench.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-rA --strict-markers --color=yes"
